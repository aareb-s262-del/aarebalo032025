<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Align-Items Live Demo</title>
    <style>
      #flexparent {
        width: 600px;
        height: 600px;
        background-color: red;
        margin: auto;
        display: flex;
        flex-direction: column;
        /* When flex direction is row */
        /* justify-content is horizontal */
        /* align-items is vertical */
        justify-content: flex-end;
        align-items: flex-start;
      }

      .flexckildren {
        height: 50px;
        width: 50px;
        background-color: seagreen;
        border: 1px solid black;
        padding: 1rem;
      }
    </style>
  </head>

  <body>
    <h1>Flexbox Align-Items Live Demo</h1>

    <div id="flexparent">
      <!-- div.flexchildren{child$}*4 -->
      <div class="flexckildren">child1</div>
      <div class="flexckildren">child2</div>
      <div class="flexckildren">child3</div>
      <div class="flexckildren">child4</div>
    </div>
  </body>
</html>
